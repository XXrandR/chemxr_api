# ChemXR API - Spring Boot 4 / WebFlux / R2DBC / Flyway
# .env es solo desarrollo local; NO subir a Git.
spring.config.import=optional:file:.env[.properties]

server.port=8081
spring.application.name=chemxr_api

# Consultas de la API: R2DBC reactivo
spring.r2dbc.url=r2dbc:postgresql://${CHEMXR_DB_HOST:localhost}:${CHEMXR_DB_PORT:5432}/${CHEMXR_DB_NAME:chemdb}
spring.r2dbc.username=${CHEMXR_DB_USER:maximus}
spring.r2dbc.password=${CHEMXR_DB_PASSWORD}
spring.r2dbc.pool.enabled=true

# Flyway: usa JDBC en el inicio de la aplicación, sin cambiar R2DBC
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://${CHEMXR_DB_HOST:localhost}:${CHEMXR_DB_PORT:5432}/${CHEMXR_DB_NAME:chemdb}
spring.flyway.user=${CHEMXR_DB_USER:maximus}
spring.flyway.password=${CHEMXR_DB_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=app
spring.flyway.default-schema=app
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
