# PostgreSQL local - Flyway crea las tablas cuando inicia Spring Boot.
# No se monta init_chemdb.sql: evita inicializaciones competidoras.
services:
  main_db:
    image: postgres:17
    container_name: chemdb
    environment:
      TZ: America/Lima
      POSTGRES_USER: ${CHEMXR_DB_USER:-maximus}
      POSTGRES_PASSWORD: ${CHEMXR_DB_PASSWORD:?Define CHEMXR_DB_PASSWORD en .env}
      POSTGRES_DB: ${CHEMXR_DB_NAME:-chemdb}
    ports:
      - "${CHEMXR_DB_PORT:-5435}:5432"
    volumes:
      - chemxr_pgdata:/var/lib/postgresql/data
    networks:
      - unrd_subway
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  unrd_subway:
    driver: bridge

volumes:
  chemxr_pgdata:
    driver: local
